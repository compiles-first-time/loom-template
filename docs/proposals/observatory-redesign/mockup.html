<style>
  :root{
    --bg:#0F1416; --surface:#161D1F; --surface-2:#1D2528; --raised:#222C30;
    --border:#2A3538; --border-soft:#212B2E;
    --text:#E7EEEC; --dim:#B4C0BF; --faint:#8B9796;
    --accent:#45C7BD; --accent-2:#7FD9D1; --accent-soft:rgba(69,199,189,.14); --accent-line:rgba(69,199,189,.35);
    --good:#57BB8A; --good-soft:rgba(87,187,138,.15); --good-rgb:87,187,138;
    --warn:#E2A63E; --warn-soft:rgba(226,166,62,.15); --warn-rgb:226,166,62;
    --crit:#E36C6C; --crit-soft:rgba(227,108,108,.15); --crit-rgb:227,108,108;
    --info:#6FA8DC; --info-soft:rgba(111,168,220,.15);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --r:10px; --r-sm:7px;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.28);
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#EFF3F1;--surface:#FFFFFF;--surface-2:#E9EFED;--raised:#F3F7F5;--border:#D8E0DD;--border-soft:#E4EAE8;
      --text:#14211F;--dim:#455350;--faint:#5C6B67;--accent:#0C8B85;--accent-2:#0A716C;--accent-soft:rgba(12,139,133,.10);--accent-line:rgba(12,139,133,.30);
      --good:#2C8B62;--good-soft:rgba(44,139,98,.12);--good-rgb:44,139,98;--warn:#B07714;--warn-soft:rgba(176,119,20,.12);--warn-rgb:176,119,20;
      --crit:#C2494A;--crit-soft:rgba(194,73,74,.12);--crit-rgb:194,73,74;--info:#3B7BB5;--info-soft:rgba(59,123,181,.12);
      --shadow:0 1px 2px rgba(20,40,38,.06),0 10px 34px rgba(20,40,38,.10);}
  }
  :root[data-theme="light"]{--bg:#EFF3F1;--surface:#FFFFFF;--surface-2:#E9EFED;--raised:#F3F7F5;--border:#D8E0DD;--border-soft:#E4EAE8;
    --text:#14211F;--dim:#455350;--faint:#5C6B67;--accent:#0C8B85;--accent-2:#0A716C;--accent-soft:rgba(12,139,133,.10);--accent-line:rgba(12,139,133,.30);
    --good:#2C8B62;--good-soft:rgba(44,139,98,.12);--good-rgb:44,139,98;--warn:#B07714;--warn-soft:rgba(176,119,20,.12);--warn-rgb:176,119,20;
    --crit:#C2494A;--crit-soft:rgba(194,73,74,.12);--crit-rgb:194,73,74;--info:#3B7BB5;--info-soft:rgba(59,123,181,.12);
    --shadow:0 1px 2px rgba(20,40,38,.06),0 10px 34px rgba(20,40,38,.10);}
  :root[data-theme="dark"]{--bg:#0F1416;--surface:#161D1F;--surface-2:#1D2528;--raised:#222C30;--border:#2A3538;--border-soft:#212B2E;
    --text:#E7EEEC;--dim:#B4C0BF;--faint:#8B9796;--accent:#45C7BD;--accent-2:#7FD9D1;--accent-soft:rgba(69,199,189,.14);--accent-line:rgba(69,199,189,.35);
    --good:#57BB8A;--good-soft:rgba(87,187,138,.15);--good-rgb:87,187,138;--warn:#E2A63E;--warn-soft:rgba(226,166,62,.15);--warn-rgb:226,166,62;
    --crit:#E36C6C;--crit-soft:rgba(227,108,108,.15);--crit-rgb:227,108,108;--info:#6FA8DC;--info-soft:rgba(111,168,220,.15);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.28);}

  :root{color-scheme:dark}
  @media (prefers-color-scheme: light){:root{color-scheme:light}}
  :root[data-theme="light"]{color-scheme:light}
  :root[data-theme="dark"]{color-scheme:dark}
  .tier{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;border:1px solid transparent;white-space:nowrap}
  .tier-free{color:var(--good);background:var(--good-soft)}
  .tier-low{color:var(--info);background:var(--info-soft)}
  .tier-standard{color:var(--warn);background:var(--warn-soft)}
  .tier-premium{color:var(--crit);background:var(--crit-soft)}
  .cap-banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:8px;padding:11px 14px;margin-bottom:14px;color:var(--text);font-size:13.5px;line-height:1.5}
  .cap-banner b{color:var(--text)} .cap-banner .cb-ico{color:var(--warn);flex:none}
  .audit.inflight .ev::before{background:var(--warn);border-color:var(--surface)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:660;letter-spacing:-.01em}
  code,.mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer} a{color:inherit}
  ::selection{background:var(--accent-soft)}
  .app{display:grid;grid-template-columns:214px 1fr;grid-template-rows:auto 1fr;min-height:100vh}

  .topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;font-weight:680;letter-spacing:-.02em}
  .brand .mark{width:22px;height:22px;border-radius:6px;background:radial-gradient(circle at 30% 30%,var(--accent-2),var(--accent) 70%);position:relative;flex:none}
  .brand .mark::after{content:"";position:absolute;inset:5px;border-radius:3px;border:1.5px solid rgba(0,0,0,.35)}
  .brand small{color:var(--faint);font-family:var(--mono);font-size:11px;font-weight:500}
  .topbar .spacer{flex:1}
  .icon-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--dim);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;transition:.15s}
  .icon-btn:hover{color:var(--text);border-color:var(--accent-line)}
  .runsel{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 11px;font-family:var(--mono);font-size:12px;color:var(--text)}
  .runsel .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
  .runsel small{color:var(--faint)}
  .actor{display:flex;align-items:center;gap:7px;font-size:12.5px}
  .ava{border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;color:#08110F;flex:none}
  .ava.sm{width:18px;height:18px;font-size:9px} .ava.md{width:24px;height:24px;font-size:10px} .ava.lg{width:34px;height:34px;font-size:12px}

  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--dim);background:var(--surface-2);white-space:nowrap}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:var(--good-soft)}
  .pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
  .pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:var(--crit-soft)}
  .pill.accent{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
  .pill.info{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent);background:var(--info-soft)}

  .nav{background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
  .nav .group-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--dim);border:none;background:none;width:100%;text-align:left;font-size:13.5px;font-weight:500;transition:.13s;position:relative}
  .nav-item svg{width:16px;height:16px;flex:none;opacity:.8}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--accent-soft);color:var(--text);font-weight:600}
  .nav-item.active svg{opacity:1;color:var(--accent)}
  .nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .nav-item .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}

  .main{padding:22px 34px 60px;max-width:1460px;overflow:auto}
  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view{animation:none}}
  .view-head{margin-bottom:16px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .view-head h1{font-size:23px;margin:6px 0 6px} .view-head p{color:var(--dim);margin:0;max-width:74ch;line-height:1.7}
  .sec-title{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:24px 0 11px;font-weight:600;display:flex;align-items:center;gap:10px}

  .hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
  .hero-card{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
  .hero-card::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--accent-soft);filter:blur(10px)}
  .hero-status{display:flex;align-items:center;gap:11px;margin-bottom:11px;position:relative}
  .hero-status .halo{width:36px;height:36px;border-radius:50%;background:var(--good-soft);display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
  .hero-status .halo b{width:11px;height:11px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
  .hero-status h2{font-size:18px} .hero-status .sub{color:var(--dim);font-size:12.5px;font-family:var(--mono)}
  .hero-line{color:var(--dim);font-size:13.5px;line-height:1.7;position:relative;max-width:56ch} .hero-line b{color:var(--text);font-weight:600}
  .hero-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;position:relative}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-top:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;transition:.15s;position:relative}
  .tile.link{cursor:pointer}
  .tile.link:hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .val.txt{font-size:15px;font-weight:660;line-height:1.2;margin-top:6px}
  .tile .label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .tile .val{font-size:25px;font-weight:680;margin-top:6px;letter-spacing:-.02em;line-height:1}
  .tile .foot{font-size:12.5px;color:var(--dim);margin-top:5px}
  .tile .spark{position:absolute;right:11px;bottom:11px;opacity:.85}
  .strip{position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0}
  .strip.good{background:var(--good)} .strip.accent{background:var(--accent)} .strip.warn{background:var(--warn)} .strip.info{background:var(--info)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:860px){.grid-2,.hero{grid-template-columns:1fr}}
  .row{display:flex;align-items:center;gap:12px} .spacer{flex:1}

  table.dt{width:100%;border-collapse:collapse;font-size:14px}
  table.dt th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  table.dt td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
  table.dt tr[data-drawer]{cursor:pointer;transition:.1s} table.dt tbody tr[data-drawer]:hover{background:var(--surface-2)}
  table.dt tr:last-child td{border-bottom:none}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
  .req-name{font-weight:600} .req-id{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .chip{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid var(--border);color:var(--dim);background:var(--surface-2);white-space:nowrap}
  .chip.deny,.chip.SE{color:var(--crit);background:var(--crit-soft);border-color:transparent}
  .chip.ask,.chip.BE{color:var(--warn);background:var(--warn-soft);border-color:transparent}
  .chip.allow,.chip.BR{color:var(--good);background:var(--good-soft);border-color:transparent}
  .chip.TR{color:var(--info);background:var(--info-soft);border-color:transparent}
  .chip.none{color:var(--faint)}
  .run-tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);white-space:nowrap}
  .env-tag{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
  .env-tag.dev{background:var(--info-soft);color:var(--info)} .env-tag.prod{background:var(--crit-soft);color:var(--crit)}
  .st-dot{width:9px;height:9px;border-radius:50%;display:inline-block} .st-dot.pass{background:var(--good)} .st-dot.fail{background:var(--crit)}
  .meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden} .meter>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
  .rep-bar{display:flex;align-items:center;gap:9px} .rep-bar .meter{flex:1;min-width:52px} .rep-score{font-family:var(--mono);font-weight:650;font-size:13px;min-width:44px}

  /* branch tree */
  .tree{font-family:var(--mono);font-size:12.5px;line-height:1.5}
  .tbranch{margin-bottom:6px}
  .tbranch .bhead{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 0}
  .tbranch .bhead .gd{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);flex:none}
  .tbranch .bhead .bn{color:var(--text)} .tbranch .bhead.main .gd{border-color:var(--dim)}
  .commits{margin:0 0 4px 5px;border-left:1.5px solid var(--border);padding-left:16px}
  .commit{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:5px 0;cursor:pointer;border-radius:6px}
  .commit:hover{background:var(--surface-2)}
  .commit .h{color:var(--accent);font-size:11.5px} .commit .msg{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .commit .msg b{color:var(--text);font-weight:600}

  /* decisions redesign */
  .dec-card{display:grid;grid-template-columns:196px 1fr;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;margin-bottom:12px;background:var(--surface);transition:.14s}
  .dec-card:hover{border-color:var(--accent-line);transform:translateY(-1px)}
  .dec-left{padding:16px;display:flex;flex-direction:column;justify-content:center;gap:11px;position:relative;border-right:1px solid var(--border-soft)}
  .dec-left::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(var(--cc),.20),rgba(var(--good-rgb),.05) 92%)}
  .dec-left>*{position:relative}
  .dec-asker .lbl{font-size:10px;font-family:var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
  .dec-asker b{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--text);margin-top:4px}
  .dec-when{font-family:var(--mono);font-size:13px;color:var(--text);font-weight:600}
  .dec-when small{display:block;color:var(--faint);font-weight:400;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  .dec-calls{font-family:var(--mono);font-size:13px;color:var(--text);font-weight:600}
  .dec-calls small{display:block;color:var(--faint);font-weight:400;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  .dec-main{padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:11px}
  .dec-q{font-weight:650;font-size:16px;line-height:1.38}
  .dec-badges{display:flex;gap:8px;flex-wrap:wrap}

  .kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
  .kb-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;min-height:110px;display:flex;flex-direction:column;gap:8px}
  .kb-col.drop{border-color:var(--accent);background:var(--accent-soft)}
  .kb-col h4{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;margin:2px 4px 4px}
  .kb-card{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 11px;cursor:grab;transition:.12s}
  .kb-card:hover{border-color:var(--accent-line);transform:translateY(-1px)} .kb-card.dragging{opacity:.4}
  .kb-card .title{font-weight:600;font-size:13px}
  .kb-card .meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  .gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
  .gloss dt{font-weight:660;font-size:14px} .gloss dd{margin:6px 0 0;color:var(--dim);font-size:13px;line-height:1.65}
  .cost-bar{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
  .cost-bar>span{display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:#08110F}

  .feed{display:flex;flex-direction:column}
  .feed-item{display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:.12s;align-items:start}
  .feed-item:last-child{border-bottom:none} .feed-item:hover{background:var(--surface-2);border-radius:8px}
  .feed-glyph{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;margin-top:1px;flex:none} .feed-glyph svg{width:14px;height:14px}
  .feed-body .t{font-size:13.5px;line-height:1.45} .feed-body .m{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:3px}
  .feed-time{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;padding-top:2px}
  .g-good{background:var(--good-soft);color:var(--good)} .g-warn{background:var(--warn-soft);color:var(--warn)} .g-crit{background:var(--crit-soft);color:var(--crit)} .g-accent{background:var(--accent-soft);color:var(--accent)} .g-info{background:var(--info-soft);color:var(--info)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(6,10,10,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(500px,94vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);z-index:50;display:flex;flex-direction:column}
  .drawer.wide{width:min(820px,97vw)} .drawer.open{transform:none}
  @media (prefers-reduced-motion:reduce){.drawer{transition:none}}
  .drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2}
  .drawer-head .k{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
  .drawer-head h3{font-size:18px;margin-top:4px}
  .drawer-body{padding:18px 20px;overflow:auto}
  .drawer-body h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:22px 0 9px;display:flex;align-items:center;gap:8px} .drawer-body h4:first-child{margin-top:0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:14px} .kv .k{color:var(--dim)} .kv .v{text-align:right;font-family:var(--mono)}

function bindModels(){

 root.querySelectorAll('[data-raise]').forEach(b=>b.onclick=e=>{e.stopPropagation();const s=b.dataset.raise,j=s.indexOf(':');raiseCap(s.slice(0,j),+s.slice(j+1));});

function editCell(c){if(c.querySelector('input'))return;const m=MODELS.find(x=>x.id===c.dataset.mid),field=c.dataset.field;

 },1000);}

   ${cases.map(c=>`<tr><td style="vertical-align:top"><span class="chip ${c.type==='---'?'none':c.type}">${c.type==='---'?'step':c.type}</span></td>
     <td><div style="font-weight:600">${c.c}</div><div class="req-id">${c.id}</div>${RERUN_LOG[c.id]?`<div style="color:var(--${RERUN_LOG[c.id].tone});font-size:11px;line-height:1.4;margin-top:5px;font-family:var(--mono)">Last re-run ${RERUN_LOG[c.id].t} &#8212; ${RERUN_LOG[c.id].text}</div>`:''}</td>
     <td class="num" style="color:var(--dim)">${c.ei} <span style="color:var(--faint)">&#8594;</span> ${c.eo}</td>
     <td class="num">${isPass(c)?`<span style="color:var(--good)">${c.eo}</span>`:`${c.ai} <span style="color:var(--faint)">&#8594;</span> ${c.ao}`}</td>
     <td style="color:var(--dim);font-size:12px;max-width:200px">${c.why}</td>
     <td>${isPass(c)?'<span class="st-dot pass" title="pass"></span>':`<button class="btn sm" data-rerun data-req="${r.id}" data-case="${c.id}">Re-run</button>`}</td></tr>`).join('')}
   </tbody></table></div>
   ${failing.map(c=>`<div class="note warn" style="margin-top:12px"><b>${c.id} &#8212; failing &#183; ${c.failKind||'broken'}.</b> ${c.failReason||''}<br>${c.failKind==='flaky'?'This is a <b>flaky</b> (transient) failure &#8212; a <b>Re-run</b> should clear it.':`This is a <b>${c.failKind||'real'}</b> failure &#8212; re-running just reproduces it. It turns green only when the cause is resolved${c.resolver?`: <button class="btn sm primary" data-resolve="${r.id}:${c.id}">${c.resolver}</button>`:'.'}`}</div>`).join('')}
   ${fails?`<div class="note" style="margin-top:12px"><b>Why re-run isn&#8217;t a fix:</b> a <b>flaky</b> failure (e.g. the live 2nd model timed out) clears on retry; a <b>blocked</b> one (waiting on evidence, like a measurement) or a <b>broken</b> one (a real defect) reproduces until you resolve the cause. Other follow-ups: <button class="btn sm">View log</button> <button class="btn sm">Assign to critic</button> <button class="btn sm">Open register</button></div>`:''}
   <div class="note" style="margin-top:12px">Full register: <code>observability/eval-suite/requirements/${r.id}.md</code> &#8212; every expected-vs-actual row, kept for regression.</div>
  </div>`;
 },
 decision(i){const d=DECISIONS[i];const claudeVoices=d.votes.filter(v=>v.fam==='claude').length;
  return `<div class="drawer-head"><div><div class="k">Decision &#183; ${d.run}</div><h3 style="font-size:16px">${d.q}</h3></div>${closeBtn}</div>
  <div class="drawer-body">
   <div class="row" style="gap:8px;flex-wrap:wrap"><span class="pill accent"><span class="dot"></span>${d.answer}</span>${confPill(d.conf,d.escalate)}</div>
   <div class="kv" style="margin-top:16px"><span class="k">Asked by</span><span class="v">${d.asker}</span><span class="k">When</span><span class="v">${d.time}</span><span class="k">Resolved</span><span class="v" style="text-align:right;max-width:230px;white-space:normal">${d.approver}</span><span class="k">Method</span><span class="v">${d.method}</span></div>
   <h4>The ${d.calls} model calls this cost <span class="pill" style="font-weight:500">&#8220;cost&#8221; = model calls</span></h4>
   ${d.callDetail.map(c=>`<div class="prov"><b>Call ${c.n}</b> &#8212; ${c.what}<br><span class="req-id">${c.model}</span></div>`).join('')}
   <h4>Independence &#8212; why it&#8217;s ${d.indep}, not ${d.votes.length}</h4>
   <div class="note">${d.votes.length} voices, but <b>${claudeVoices} share the Claude family</b> &#8212; correlated, so they count as ~one independent source. With the ${d.votes.length-claudeVoices>0?'llama':'other'} family, <b>effective independence = ${d.indep}</b>. That&#8217;s why unanimous-looking votes don&#8217;t automatically mean high confidence.</div>
   <h4>Who voted &#8212; and how much it counted</h4>
   ${d.votes.map(v=>`<div class="vote"><span class="ava md" style="background:${avaColor(v.a)}">${v.a.slice(0,2).toUpperCase()}</span>
     <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px">${v.a} <span class="chip ${v.kind==='agent'?'BR':'TR'}" style="font-size:9px">${v.kind==='agent'?'agent':v.kind==='model'?'model':'model &#215;3'}</span> <span class="indep-badge ${v.indep?'y':'n'}">${v.indep?'independent':v.fam+' family'}</span></div><div style="font-size:11.5px;color:var(--faint)">${v.r}</div></div>
     <div style="text-align:right"><span class="chip ${v.v==='reject'?'deny':v.v==='approve'?'allow':'none'}">${v.v}</span><div class="req-id" style="margin-top:3px" title="${v.wr}">weight ${v.w.toFixed(2)}</div></div></div>`).join('')}
   <h4>Why the weights differ</h4>
   <div class="note">Agents are weighted by their <b>live reputation score</b> (hover a weight to see the source): the two authorities carried more say than the new stand-in. <b>Models</b> aren&#8217;t reputation-tracked yet, so they vote at <b>baseline 1</b>. Weights are then capped so no single voice can exceed the others combined.</div>
   ${d.escalate?`<div class="note warn" style="margin-top:12px">Confidence 0.32 is below the floor (0.40) and reviewers were split &#8212; so this was <b>escalated to a human</b> rather than acted on. Reputation-weighting gave the two authorities more say, but not decisively.</div>`:''}
  </div>`;
 },
 run(id){const r=RUNS.find(x=>x.id===id);
  return `<div class="drawer-head"><div><div class="k">Run &#183; ${r.status}</div><h3 style="font-size:16px">${r.label}</h3><div style="color:var(--dim);font-size:12px;margin-top:4px">${ava(r.owner.name,'sm')} ${r.owner.name} &#183; <span class="chip">${r.branch}</span> <span class="env-tag ${r.env}">${r.env}</span></div></div>${closeBtn}</div>
  <div class="drawer-body">
   <div class="note">${r.goal}</div>
   <div class="tiles" style="margin-top:14px">
     <div class="tile"><div class="label">Requirements</div><div class="val num" style="font-size:20px">${r.req.total?r.req.pass+'/'+r.req.total:'&#8212;'}</div><div class="foot">${r.req.pend?r.req.pend+' pending':(r.req.total?'all checked':'none')}</div></div>
     <div class="tile"><div class="label">Safety-catches</div><div class="val num" style="font-size:20px">${r.safety.deny+r.safety.ask}</div><div class="foot">${r.safety.deny} deny &#183; ${r.safety.ask} ask</div></div>
     <div class="tile"><div class="label">Decisions</div><div class="val num" style="font-size:20px">${r.decisions}</div><div class="foot">governed</div></div>
     <div class="tile"><div class="label">Cost</div><div class="val num" style="font-size:20px">$${r.cost.toFixed(2)}</div><div class="foot">${r.ops} ops</div></div>
   </div>
   <h4>Identity</h4>
   <div class="kv"><span class="k">Run ID</span><span class="v">${r.id}</span><span class="k">Project &#183; epic</span><span class="v">${r.project} &#183; ${r.epic}</span><span class="k">Owner</span><span class="v">${r.owner.name}</span><span class="k">Branch &#183; env</span><span class="v">${r.branch} &#183; ${r.env}</span><span class="k">Started</span><span class="v">${r.started}</span><span class="k">Duration</span><span class="v">${r.duration}</span><span class="k">Commits</span><span class="v">${r.commits}</span></div>
   <h4>Agents on this run</h4>
   <div class="skills">${r.agents.length?r.agents.map(a=>`<span class="skill">${ava(a,'sm')} ${a}</span>`).join(''):'<span class="req-id">automation &#8212; no agents</span>'}</div>
   <h4>Scoped views</h4>
   <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn sm" data-gonav="requirements">Requirements</button><button class="btn sm" data-gonav="decisions">Decisions</button><button class="btn sm" data-gonav="governance">Governance</button><button class="btn sm" data-gonav="work">Work</button></div>
   <div class="note" style="margin-top:14px">Everything above is <b>scoped to this run</b> &#8212; in the live build these buttons deep-link each view filtered to <code>${r.id}</code>.</div>
  </div>`;
 },
 rule(id){const r=allRules().find(x=>x.id===id);
  return `<div class="drawer-head"><div><div class="k">${r.local?'Local rule':r.imm?'Foundational &#183; immutable':'Operational rule'}</div><h3>${r.local?r.id:'Rule '+r.num} &#8212; ${r.title}</h3></div>${closeBtn}</div>
  <div class="drawer-body">
   ${r.imm?`<div class="row" style="margin-bottom:12px"><span class="imm-badge">${svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>')} Effectively immutable &#8212; changeable only via explicit override-authority sign-off</span></div>`:''}
   <h4>Canonical text</h4><div class="formula" style="white-space:normal;line-height:1.6">${r.text}</div>
   <div class="kv" style="margin-top:14px"><span class="k">Rule</span><span class="v">${r.local?r.id:'Kernel Rule '+r.num}</span><span class="k">Group</span><span class="v">${ruleGroupOf(r)}</span><span class="k">Mutability</span><span class="v">${r.imm?'immutable':'amendable'}</span><span class="k">Provenance</span><span class="v">${r.local?'Local &#183; '+r.addedBy:'Kernel V6'}</span>${r.local?`<span class="k">Added</span><span class="v">${r.addedAt}</span>`:''}</div>
   <h4>Cited this run <span class="pill" style="font-weight:500">${citeTotal(r)} citation${citeTotal(r)===1?'':'s'}</span></h4>
   ${citeTotal(r)?`<div class="tbl-wrap"><table class="dt"><thead><tr><th>Operation</th><th>Verdict</th><th>When</th></tr></thead><tbody>${r.cites.map(x=>`<tr><td><code>${x.op}</code></td><td><span class="chip ${x.v}">${x.v}</span></td><td class="req-id">${x.t}</td></tr>`).join('')}</tbody></table></div>
   <div style="margin-top:12px"><button class="btn primary sm" data-gonav="governance">Open in Governance &#8594;</button></div>`:`<div class="note">No citations on this run yet &#8212; this rule is in force but hasn&#8217;t been invoked.</div>`}
  </div>`;
 },
 model(id){const m=MODELS.find(x=>x.id===id);if(!m)return `<div class="drawer-head"><div><div class="k">Model</div><h3>&#8212;</h3></div>${closeBtn}</div>`;const spent=mSpend(m),pct=mPct(m),ft=mFallsTo(m.id);
  return `<div class="drawer-head"><div><div class="k">Model &#183; ${m.provider}</div><h3>${m.label}</h3><div class="req-id" style="margin-top:3px">LiteLLM alias ${m.litellm} &#183; ${m.provider==='ollama'?'localhost:11434':'via proxy :4000'}</div></div>${closeBtn}</div>
  <div class="drawer-body">
   <div class="note">${m.local?'The local safety-net model. It&#8217;s free ($0), never caps, and anchors the fallback tail so auto-fall-back routing always resolves down to it.':`Runs the <b>${m.agents.join(', ')||'&#8212;'}</b> ${m.agents.length===1?'agent':'agents'}. At its $${m.cap.toFixed(2)} cap, new work ${m.onCap==='fallback'&&ft?'<b>auto-falls-back to '+ft.label+'</b>':'<b>stops</b> &#8212; agents halted, not rerouted'}.`}</div>
   <div style="display:flex;align-items:center;gap:16px;margin:16px 0">${ring(m.local?0:pct,mColor(m),88,m.local?'$0':(pct*100).toFixed(0)+'%',m.local?'local':'$'+spent.toFixed(2)+' / $'+m.cap.toFixed(2))}
    <div style="flex:1"><div class="kv"><span class="k">Spend</span><span class="v">$${spent.toFixed(2)}</span><span class="k">Cap</span><span class="v">${m.local?'&#8212;':'$'+m.cap.toFixed(2)}</span><span class="k">At cap</span><span class="v">${m.local?'always on':m.onCap}</span></div></div></div>
   <h4>Pricing <span class="pill" style="font-weight:500">editable in the table</span></h4>
   <div class="kv"><span class="k">$ / 1M input</span><span class="v">$${m.priceIn.toFixed(2)}</span><span class="k">$ / 1M output</span><span class="v">$${m.priceOut.toFixed(2)}</span></div>
   <h4>How spend is computed</h4>
   <div class="formula">spend = ${fmtTok(m.tokensIn)}/1e6 &#215; $${m.priceIn.toFixed(2)} + ${fmtTok(m.tokensOut)}/1e6 &#215; $${m.priceOut.toFixed(2)}
      = <b>$${spent.toFixed(2)}</b></div>
   <h4>Identity</h4>
   <div class="kv"><span class="k">Model ID</span><span class="v">${m.id}</span><span class="k">Context</span><span class="v">${m.ctx/1000}K</span><span class="k">Routed roles</span><span class="v">${m.roles.join(', ')}</span><span class="k">Agents</span><span class="v">${m.agents.join(', ')||'&#8212;'}</span></div>
   <h4>Fallback preview</h4>
   <div class="row" style="gap:6px;flex-wrap:wrap">${[m.id,...chainFrom(m.id)].map((x,i)=>{const mm=MODELS.find(z=>z.id===x);return `${i>0?'<span style="color:var(--faint);font-family:var(--mono)">&#8594;</span>':''}<span class="${i===0?'run-tag':'chip'}">${mm.label}</span>`;}).join(' ')}</div>
   ${(m.inflight&&m.inflight.length)?(()=>{const cap=mCapped(m),ck=checkpointedOf(m).length;return `<h4>In-flight work ${!cap?'<span class="pill good" style="font-weight:500">running</span>':ck?'<span class="pill warn" style="font-weight:500">checkpointed &#183; paused</span>':'<span class="pill crit" style="font-weight:500">dropped at cap</span>'}</h4>
   <div class="audit${cap&&ck?' inflight':''}">${m.inflight.map(t=>`<div class="ev"><div class="at"><span class="run-tag">${t.id}</span> ${!cap?'running &#183; '+(t.steps||t.pct+'%'):ck?'paused &#183; '+(t.steps||t.pct+'%')+' &#8212; checkpointed':'dropped at cap &#8212; not saved'}</div><div class="aw">${t.what}</div></div>`).join('')}</div>
   ${cap&&ck?`<div class="note warn" style="margin-top:12px"><b>${m.label} is at its $${m.cap.toFixed(2)} cap.</b> These tasks are <b>checkpointed</b> &#8212; their completed steps are saved and won&#8217;t be recomputed. Raise the cap to resume each from its last checkpoint.<div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" data-raise="${m.id}:100">Raise cap +$100 &amp; resume</button><button class="btn sm" data-raise="${m.id}:500">+$500 &amp; resume</button></div></div>`:''}
   ${cap&&!ck?`<div class="note warn" style="margin-top:12px"><b>${m.label} is at its $${m.cap.toFixed(2)} cap and checkpointing is off.</b> These in-flight tasks were dropped and will be recomputed from scratch. Turn on &#8220;In-flight at cap&#8221; below to make work durable (ADR-0052).</div>`:''}`;})():''}
   <h4>Cap behavior</h4>
   <div class="kv"><span class="k">New work at cap</span><span class="v">${m.local?'&#8212;':m.onCap==='stop'?'stop (halt)':'fall back &#8594; '+((mFallsTo(m.id)||{}).label||'&#8212;')}</span><span class="k">In-flight at cap</span><span class="v" style="display:flex;align-items:center;gap:8px;justify-content:flex-end">${m.checkpoint?'checkpoint (resume from last step)':'dropped (recomputed)'} ${m.local?'':`<button class="btn sm" data-ckpt="${m.id}" aria-pressed="${!!m.checkpoint}">${m.checkpoint?'on':'off'}</button>`}</span></div>
   ${!m.local&&!m.checkpoint&&!mCapped(m)?`<div class="note warn" style="margin-top:10px">Checkpointing is <b>off</b> &#8212; if this model caps, in-flight work is dropped and recomputed later. Turn it on to make work durable (ADR-0052).</div>`:''}
   <div class="prov" style="margin-top:14px"><b>Routing:</b> ADR-0045 (per-agent model routing via the LiteLLM proxy). <b>Durable execution:</b> ADR-0052. <b>Cost discipline:</b> LR-06. <b>Config:</b> <code>${BUDGET.cfg}</code>.</div>
  </div>`;
 },
 fallback(){return `<div class="drawer-head"><div><div class="k">Routing</div><h3>Fallback chain &#8212; how capping cascades</h3></div>${closeBtn}</div>
  <div class="drawer-body">
   <div class="note">When a model reaches its spend cap with <b>auto-fall-back</b> on, agents routed to it switch to the next available model down this order. If that one is also capped, routing walks further down &#8212; until it reaches the local model, which never caps.</div>
   <h4>Current order</h4>
   <div style="display:flex;flex-direction:column;gap:8px">${FALLBACK.map((id,i)=>{const m=MODELS.find(x=>x.id===id);return `<div class="row" style="gap:10px"><span class="chain-num">${i+1}${['st','nd','rd'][i]||'th'}</span><span class="${m.local?'run-tag':'chip'}">${m.label}</span><span class="req-id">${m.local?'local &#183; $0 &#183; pinned last':'cap $'+m.cap.toFixed(2)+' &#183; '+m.onCap}</span></div>`;}).join('')}</div>
   <h4>Stop vs auto-fall-back</h4>
   <div class="kv"><span class="k">Stop</span><span class="v" style="font-family:var(--sans);color:var(--dim);text-align:right;max-width:270px;white-space:normal">At the cap, the model hard-denies new work. Agents on it are halted &#8212; nothing reroutes.</span><span class="k">Fall back</span><span class="v" style="font-family:var(--sans);color:var(--dim);text-align:right;max-width:270px;white-space:normal">At the cap, agents reroute to the next model in this chain automatically.</span></div>
   <div class="note" style="margin-top:14px">With auto-fall-back on, the chain resolves down to Llama 3 (local, $0); a model set to &#8220;stop&#8221; halts its own agents at the cap instead of rerouting (LR-06).</div>
  </div>`;
 }
};

const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('obs-theme',t);}catch(e){}}
themeBtn.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');applyTheme(cur==='dark'?'light':'dark');};
try{const s=localStorage.getItem('obs-theme');if(s)applyTheme(s);}catch(e){}
const runselEl=document.getElementById('runsel');runselEl.style.cursor='pointer';runselEl.title='View all runs';runselEl.onclick=()=>go('runs');
renderNav();go('overview');
</script>
