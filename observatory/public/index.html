<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loom Observatory</title>
  <link rel="stylesheet" href="/css/observatory.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark"></span><span style="display:flex;flex-direction:column;line-height:1.15"><span style="font-weight:680">loom-template</span><small style="font-weight:500">Loom Observatory &middot; L9</small></span></div>
    <div class="runsel" id="runsel"><span class="dot"></span><span id="runName">Run 7</span> <small id="runBranch">phase1-backlog</small></div>
    <span class="spacer"></span>
    <div class="actor"><span class="ava sm" style="background:#45C7BD">NN</span><span>Nick Noel</span></div>
    <div class="header-status"><span class="status-dot" id="connDot"></span><span id="connText">connecting…</span></div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle light / dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6 4.5 4.5M18 18l1.5 1.5M6 18l-1.5 1.5M18 6l1.5-1.5"/><circle cx="12" cy="12" r="4"/></svg></button>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Detail" role="dialog"></aside>
<div class="toast" id="toast"></div>
<script type="module" src="/js/app.mjs"></script>
</body>
</html>
